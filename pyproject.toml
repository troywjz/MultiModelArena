[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodel-arena"
version = "0.1.0"
description = "多模型多轮评测与 Markdown 报告工具"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "MultiModelArena contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
arena = "arena.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
